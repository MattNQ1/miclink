<script>
/* GitHub Pages shows this file for any missing address, at any depth. The links below are
   relative, so point them at the site's own folder when this was not opened as 404.html itself. */
(function () {
  if (/\/404(\.html)?$/.test(location.pathname)) return;
  var first = location.pathname.split("/")[1];
  var root = /\.github\.io$/i.test(location.hostname) && first ? "/" + first + "/" : "/";
  var base = document.createElement("base");
  base.href = root;
  document.head.appendChild(base);
})();
</script>
